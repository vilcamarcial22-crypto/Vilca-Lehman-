<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vilca-Lehman | Moda para Mujer</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff8fb;
  color: #333;
}

header {
  background: linear-gradient(135deg, #8e315d, #c86b91);
  color: white;
  text-align: center;
  padding: 35px 20px;
}

.logo {
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 2px;
}

header p {
  margin-top: 10px;
  font-size: 17px;
}

nav {
  background: white;
  padding: 15px;
  text-align: center;
  box-shadow: 0 2px 10px #ddd;
}

nav a {
  color: #8e315d;
  text-decoration: none;
  margin: 0 10px;
  font-weight: bold;
}

.hero {
  text-align: center;
  padding: 55px 20px;
}

.hero h1 {
  color: #8e315d;
  font-size: 35px;
  margin-bottom: 15px;
}

.hero p {
  font-size: 18px;
  margin-bottom: 25px;
}

.boton {
  display: inline-block;
  background: #8e315d;
  color: white;
  padding: 14px 25px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
}

.productos {
  padding: 30px 20px;
  max-width: 1000px;
  margin: auto;
}

.productos h2 {
  text-align: center;
  color: #8e315d;
  margin-bottom: 30px;
  font-size: 28px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.card {
